services:
  - type: web
    name: sai-calibration-web
    env: python
    plan: free
    rootDir: sai_callib
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: sai-calibration-web.onrender.com
      - key: SECRET_KEY
        generateValue: true
      # One shared free Postgres (Neon/Supabase). Set this in Render dashboard.
      # All users of the website read/write the same database.
      - key: DATABASE_URL
        sync: false
