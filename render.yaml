services:
  - type: web
    name: sai-calibration-web
    env: python
    plan: free
    rootDir: sai_callib
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn sai_calibrations.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: sai-calibration-web.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sai-calibration-db
          property: connectionString

databases:
  - name: sai-calibration-db
    plan: free
