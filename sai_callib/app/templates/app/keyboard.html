<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punch Number | SAI Accurate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <style>
    body.sai-login .login-form-pane { max-width: 520px; margin: 0 auto; }
    #punch-number {
      width: 100%;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.08em;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid rgba(15,28,36,0.12);
    }
    #message { margin-top: 1rem; font-size: 1.15rem; color: #087a6d; font-weight: 700; }
    #message.error { color: #c0392b; }
  </style>
</head>
<body class="sai-login">
  <div class="login-stage">
    <div class="login-form-pane" style="width:min(560px,100%);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,0.35);">
      <h2>Punch Number</h2>
      <p class="hint">Scan or type the punch number to continue.</p>
      <form method="POST">
        {% csrf_token %}
        <label for="punch-number" style="display:block;font-weight:700;margin-bottom:0.5rem;letter-spacing:0.06em;text-transform:uppercase;color:#5a6f7a;font-size:0.8rem;">Enter the punch number</label>
        <input type="text" id="punch-number" name="punch_number" autofocus />
        <div class="login-actions" style="margin-top:1rem;">
          <button type="submit" class="sai-btn sai-btn-primary">OK</button>
        </div>
      </form>
      {% if message %}
        <div id="message" class="{{ message_type }}">{{ message }}</div>
      {% endif %}
    </div>
  </div>

  <script>
    const input = document.getElementById('punch-number');
    setInterval(() => {
      if (document.activeElement !== input) {
        input.focus();
      }
    }, 500);

    const message = document.getElementById('message');
    if (message) {
      setTimeout(() => { message.style.display = 'none'; }, 3000);
    }
  </script>
</body>
</html>
